<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rococo in Bloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Charm:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="main-menu" class="screen overlay">
    <div class="gilded-frame">
    
      <div class="mirror-glass"></div>

      <div class="mirror-reflection">
        <img src="assets/logo.png" alt="Rococo in Bloom" class="game-logo">
      
        <nav class="menu-options">
          <button id="btn-enter" class="menu-btn">Enter Repertoire</button>
          <button class="menu-btn">Adjust Slippers</button>
          <button class="menu-btn">Credits</button>
        </nav>
      </div>
    </div>
  </div>

  <div id="song-select" class="screen overlay hidden">
    <div class="book-container">
  
    <div class="page-left">
      <div id="selected-song-display" class="hidden"> <h2 id="song-title-display" class="handwritten-title">Song Title</h2>
      
        <div class="song-meta-row">
          <span class="meta-label">Duration:</span>
          <span id="song-duration-display" class="meta-value">--:--</span>
        </div>

        <div class="difficulty-container">
          <div id="difficulty-display" class="slippers-row">
            </div>
        </div>

        <div class="stats-ink">
          Personal Best: <span id="song-score-display" class="score-ink">--</span>
        </div>
      
        <button id="btn-play-song" class="ink-play-btn">Play Variation</button>

      </div>
    
      <div id="empty-state-msg" class="ink-subtitle">Select a variation...</div>
    </div>

    <div class="page-right">
      <h3 class="page-header">Repertoire</h3>
      <div id="ledger-list-container" class="ledger-list"></div>
    </div>

    <button id="btn-back" class="ribbon-bookmark">Mirror</button>
  </div>
</div>

  <div id="game" class="hidden">
    <div class="track">
      <div class="lane-line" style="--line-n: var(--line-1);"></div>
      <div class="lane-line" style="--line-n: var(--line-2);"></div>
      <div class="lane-line" style="--line-n: var(--line-3);"></div>
      <div class="lane-line" style="--line-n: var(--line-4);"></div>
      <div class="lane-container" id="lane-container"></div>
      <div class="hit-line"></div>
      <div id="multiplier-display" class="charm-regular">x1</div>
    </div>
    <div id="score-display" class="charm-regular">
      <span class="score-label">Score:</span>
      <span id="score-value">0</span>
    </div>
    <div class="feedback-text" id="feedback"></div>
  </div>

  <div id="pause-menu" class="screen overlay hidden">
    <div class="lace-overlay"></div>
    <div class="gilded-frame">
      <h2 class="title-font" style="font-size: 3rem;">Intermission</h2>
      <button id="btn-resume" class="menu-btn">Resume Performance</button>
      <button id="btn-quit" class="menu-btn">Retire to Foyer</button>
    </div>
  </div>

  <div id="game-over" class="screen overlay hidden">
    <div class="gilded-frame">
        <h2 class="title-font" style="font-size: 3rem;">Performance End</h2>
        <div id="final-score" style="font-size: 2rem; margin: 10px 0;"></div>
        <div id="stats" style="text-align: center; margin: 20px 0; font-family: 'Charm', cursive;">
          <p>Poised: <span id="stat-poised">0</span></p>
          <p>Balanced: <span id="stat-balanced">0</span></p>
          <p>Wavering: <span id="stat-wavering">0</span></p>
          <p>Lapse: <span id="stat-lapse">0</span></p>
        </div>
        <button id="restart-button" class="menu-btn">Restart Variation</button>
        <button id="btn-exit" class="menu-btn">Return to Foyer</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
