<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ballet Rhythm Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <!-- Styles will be imported via JS in Vite -->
</head>
<body>
  <div id="start-screen" class="overlay">
    <button id="start-button">Start</button>
  </div>

    <div id="game">
      <div class="track">
        <div class="lane-line" style="--line-n: var(--line-1);"></div>
        <div class="lane-line" style="--line-n: var(--line-2);"></div>
        <div class="lane-line" style="--line-n: var(--line-3);"></div>
        <div class="lane-container" id="lane-container"></div>
        <div class="hit-line"></div>
        <div id="multiplier-display" class="charm-regular">x1</div>
      </div>
      <div id="score-display" class="charm-bold">0</div>
      <div class="feedback-text" id="feedback"></div>
    </div>

  <div id="game-over" class="overlay" style="display: none;">
    <div id="final-score"></div>
    <div id="stats" style="text-align: center; margin: 20px 0;">
      <p>Total Notes: <span id="stat-total">0</span></p>
      <p>Hit Notes: <span id="stat-hit">0</span></p>
      <p>Poised: <span id="stat-poised">0</span></p>
      <p>Balanced: <span id="stat-balanced">0</span></p>
      <p>Wavering: <span id="stat-wavering">0</span></p>
      <p>Lapse: <span id="stat-lapse">0</span></p>
      <p>Average Delay: <span id="stat-delay">0</span> ms</p>
    </div>
    <button id="restart-button">Restart</button>
  </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
